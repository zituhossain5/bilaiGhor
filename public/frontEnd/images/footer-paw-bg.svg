<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!-- BilaiGhor footer pattern tile: subtle cat-paw + flower motif.
       Transparent background so the footer's dark-brown fill shows through.
       Marks are very low-opacity warm cream so they read like the Figma emboss.
       Seamless 260x260 tile (elements kept clear of edges). -->
  <defs>
    <g id="paw">
      <ellipse cx="0" cy="7" rx="11" ry="9"/>
      <ellipse cx="-11" cy="-6" rx="4.2" ry="6"/>
      <ellipse cx="-3.6" cy="-11" rx="4.2" ry="6.4"/>
      <ellipse cx="4" cy="-11" rx="4.2" ry="6.4"/>
      <ellipse cx="11" cy="-6" rx="4.2" ry="6"/>
    </g>
    <g id="flower">
      <circle cx="0" cy="-8" r="5"/>
      <circle cx="7.6" cy="-2.5" r="5"/>
      <circle cx="4.7" cy="6.5" r="5"/>
      <circle cx="-4.7" cy="6.5" r="5"/>
      <circle cx="-7.6" cy="-2.5" r="5"/>
      <circle cx="0" cy="0" r="3.4"/>
    </g>
  </defs>

  <g fill="#f6ead6" fill-opacity="0.035">
    <use href="#paw" transform="translate(52 54) rotate(-12)"/>
    <use href="#paw" transform="translate(196 92) rotate(14)"/>
    <use href="#paw" transform="translate(120 158) rotate(-6)"/>
    <use href="#paw" transform="translate(40 208) rotate(10)"/>
    <use href="#paw" transform="translate(214 214) rotate(-16)"/>
  </g>

  <g fill="#f6ead6" fill-opacity="0.028">
    <use href="#flower" transform="translate(160 30)"/>
    <use href="#flower" transform="translate(30 128)"/>
    <use href="#flower" transform="translate(212 150)"/>
    <use href="#flower" transform="translate(120 232)"/>
    <use href="#flower" transform="translate(96 96)"/>
  </g>
</svg>
